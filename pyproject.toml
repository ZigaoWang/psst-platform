[project]
name = "psst-platform"
version = "0.1.0"
description = "The Psst content platform: evidence, checks, tasks, and publishing"
requires-python = ">=3.13"
dependencies = [
    "psycopg[binary]>=3.2",
    "h3>=4.1",
    "jsonschema>=4.23",
    "pyyaml>=6.0",
    "pypdf>=5.0",
    "pypinyin>=0.53",
    "pillow>=11.0",
]

[project.scripts]
psst = "psst.cli:main"

[dependency-groups]
dev = ["pytest>=8", "mypy>=1.13", "ruff>=0.8", "types-pyyaml"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["psst"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.mypy]
python_version = "3.13"
ignore_missing_imports = true
check_untyped_defs = true
