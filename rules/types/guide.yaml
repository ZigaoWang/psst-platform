# Guide information (content.md, section 4.2).

prose_fields: [identifier, about]
schema:
  type: object
  additionalProperties: false
  required: [identifier, about, key_facts]
  properties:
    identifier: {type: string, minLength: 3, maxLength: 70}
    about: {type: string, minLength: 100, maxLength: 700}
    key_facts:
      type: array
      items:
        type: object
        additionalProperties: false
        required: [property, value, claim]
        properties:
          property: {type: string, pattern: "^P[1-9][0-9]*$"}
          value: {type: string, minLength: 1}
          value_id: {type: string, pattern: "^Q[1-9][0-9]*$"}
          claim: {type: integer, minimum: 1}

about_sentences: {min: 2, max: 3}
# The identifier is a label in the shape "[style or material] <what it is>, <year>[, by <maker>]".
identifier_shape: "^[A-Z0-9][^.]*?(, (about |c\\. )?([0-9]{3,4}s?|[0-9]{1,2}(st|nd|rd|th) century))?(, (by|now) [^,]+)?$"
identifier_refuses:
  - pattern: "\\bGrade (I|II)\\b|\\blisted\\b|\\b(declared|scheduled) monument"
    reason: repeats the heritage status, which is a key fact
  - pattern: "\\b(on|in|off|at|near) (the )?[A-Z][a-z]+ (Street|Road|Lane|Avenue|Square|Place|Hill|Row|Court|Way)\\b"
    reason: names the street; the place page already says where it is

# Key facts read from Wikidata, most useful first; at most `max_shown` are shown. `kind` says how the value is
# read: a person or item (by its English label), a date, a length or area (converted to metric), or a count.
max_shown: 6
key_facts:
  - {property: P170, label: creator, kind: person}
  - {property: P84, label: architect, kind: person}
  - {property: P571, label: built, kind: date}
  - {property: P1619, label: opened, kind: date}
  - {property: P149, label: style, kind: item}
  - {property: P1435, label: heritage status, kind: item}
  - {property: P2048, label: height, kind: length}
  - {property: P186, label: material, kind: item}
  - {property: P547, label: commemorates, kind: item}
  - {property: P825, label: dedicated to, kind: item}
  - {property: P1083, label: capacity, kind: count}
  - {property: P2043, label: length, kind: length}
  - {property: P2046, label: area, kind: area}
  - {property: P1101, label: floors, kind: count}
  - {property: P2044, label: elevation, kind: length}
  - {property: P631, label: structural engineer, kind: person}
  - {property: P193, label: builder, kind: person}
  - {property: P88, label: commissioned by, kind: item}
  - {property: P138, label: named after, kind: item}
# The date a memorial, a museum, or a park was "built" is better called what it is.
built_label: {memorial: made, culture: founded, green: established}

checks: [tool, claims, item]
item_questions:
  - Does the identifier name the right kind of thing, with the year and maker its key facts give?
  - List every name, date, number, or other detail in the prose that no claim states. Any entry fails.
  - Does the prose say anything more strongly than its claims ("the first" for "one of the first")?
  - Does the About judge or praise instead of describing?
