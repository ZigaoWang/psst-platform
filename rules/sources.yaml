# Source kinds and what they can support (design.md, section 5.3; content.md, sections 1.2 and 4).

kinds:
  official_record:
    role: primary
    examples: heritage listings, gazetteers, Hansard, government archives, planning records
  archive:
    role: primary
    examples: old newspapers, old maps, directories, digitized collections
  operator:
    role: primary
    examples: the place's owner or operator, such as the church, the company, or the transit authority
  scholarly:
    role: scholarly
    examples: museums, universities, journals, local history societies with cited research
  press:
    role: secondary
    examples: newspapers and magazines, specialist sites with editorial standards
  reference:
    role: reference
    examples: encyclopedias including Wikipedia, Wikidata, guidebooks, listicles
  community:
    role: secondary
    examples: blogs, forums, personal sites

# Hosts whose kind is fixed, whatever a writer says. A subdomain takes its parent's kind.
host_kinds:
  reference:
    - wikipedia.org
    - wikidata.org
    - wikimedia.org
    - wikivoyage.org
    - baike.baidu.com
    - baike.sogou.com
    - tripadvisor.com
    - atlasobscura.com
  community:
    - subbrit.org.uk
    - londonremembers.com
    - flickr.com
    - medium.com
    - blogspot.com
    - wordpress.com

# Never a source: search results and generated answers.
refused_url_patterns:
  - "google\\.[a-z.]+/search"
  - "bing\\.com/search"
  - "baidu\\.com/s\\?"
  - "chatgpt\\.com"
  - "chat\\.openai\\.com"
  - "perplexity\\.ai"

# Source rules per content type. `non_reference_per_claim`: every claim needs a passage from a source that is
# not `reference`. `strong_roles`: roles that count as primary or scholarly.
strong_roles: [primary, scholarly]
rules:
  story:
    min_sources: 2
    min_strong_sources: 1
    non_reference_per_claim: true
  trail:
    min_sources: 1
    min_strong_sources: 0
    non_reference_per_claim: true
  guide:
    min_sources: 1
    min_strong_sources: 0
    non_reference_per_claim: false
  photo:
    min_sources: 0
    min_strong_sources: 0
    non_reference_per_claim: false
  translation:
    min_sources: 0
    min_strong_sources: 0
    non_reference_per_claim: false

# Official records a place's Wikidata item points to (decision 28): the harness reads them for a lead before the
# writer starts, so every story begins from the record, not only the encyclopedia. {} is the property's value.
record_properties:
  P1216:
    url: "https://historicengland.org.uk/listing/the-list/list-entry/{}"
    publisher: Historic England
    title: National Heritage List for England entry {}
    kind: official_record
    language: en
