# The Psst platform: published content, the admin console, and the website. Installed as
# /etc/nginx/conf.d/psst-platform.conf by server/setup.sh, in its own server block on its own host name.

# Logs never contain IP addresses.
log_format psst_platform_noip '$time_iso8601 "$request" $status $body_bytes_sent $request_time';

server {
    listen 80;
    listen [::]:80;
    server_name psst-platform.67-230-170-225.sslip.io;
    access_log /var/log/nginx/psst-platform.access.log psst_platform_noip;
    error_log  /var/log/nginx/psst-platform.error.log crit;

    location /.well-known/acme-challenge/ { root /www/wwwroot/psst-platform/acme; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name psst-platform.67-230-170-225.sslip.io;

    ssl_certificate     /etc/letsencrypt/live/psst-platform/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/psst-platform/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    root /www/wwwroot/psst-platform/public;
    access_log /var/log/nginx/psst-platform.access.log psst_platform_noip;
    error_log  /var/log/nginx/psst-platform.error.log crit;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;

    # Manifests change on every publish, so they are never cached.
    location ~ ^/content/(staging|production)/v[0-9]+/manifest\.json$ {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options nosniff always;
        default_type application/json;
    }

    # Packs are named by their hash and never change.
    location ~ ^/content/(staging|production)/v[0-9]+/packs/ {
        gzip off;
        types { }
        default_type application/gzip;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options nosniff always;
    }
    location /content/ { return 404; }

    location ~ "^/images/[0-9a-f]{24}\.jpg$" {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options nosniff always;
    }
    location /images/ { return 404; }

    # The admin console (server-rendered, behind its own sign-in).
    location /admin {
        proxy_pass http://127.0.0.1:4317;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_http_version 1.1;
        client_max_body_size 1m;
    }

    # The website: static pages built from the published output.
    location / {
        root /www/wwwroot/psst-platform/site;
        try_files $uri $uri/index.html $uri.html =404;
    }
}
