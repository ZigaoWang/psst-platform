# Writing rules for everything Psst publishes as its own text (content.md, section 5).

# Refused anywhere in published text. Matched as whole words or phrases, ignoring case.
banned_phrases:
  - nestled
  - boasts
  - boasting
  - testament to
  - rich tapestry
  - tapestry of
  - vibrant
  - delve
  - delves
  - bustling
  - iconic
  - must-see
  - steeped in
  - whispers of the past
  - hidden gem
  - fun fact
  - did you know
  - little-known
  - psst
  - stands as a
  - stands as an
  - it's worth noting
  - it is worth noting
  - interestingly,
  - in conclusion
  - a true gem
  - treasure trove
  - bucket list
  - breathtaking
  - awe-inspiring
  - unforgettable
  - embark on
  - journey through time
  - step back in time
  - a feast for the eyes
  - look no further
  - rich history
  - stunning

# Flagged for the item check to weigh: often padding, sometimes earned.
soft_phrases:
  - fascinating
  - remarkable
  - amazing
  - incredible
  - truly
  - unique
  - a nod to
  - not just
  - not only
  - storied
  - charming
  - quaint
  - picturesque

# Refused in guide information, which never judges (content.md, section 4.2).
guide_judging_words:
  - famous
  - world-famous
  - renowned
  - celebrated
  - legendary
  - world-class
  - spectacular
  - magnificent
  - impressive
  - beautiful
  - beautifully
  - majestic
  - splendid
  - glorious
  - gorgeous
  - striking
  - elegant
  - exquisite
  - masterpiece
  - beloved
  - popular
  - treasured
  - acclaimed
  - landmark
guide_superlatives:
  - best
  - finest
  - greatest
  - largest
  - biggest
  - tallest
  - oldest
  - longest
  - highest
  - grandest
  - busiest
  - smallest
  - newest
  - earliest
  - widest
  - deepest
  - youngest
guide_phrases:
  - one of the
  - among the
  - the most
  - the least
  - known for its
  - a must

# Characters refused in published text, with what to do instead.
refused_characters:
  "—": "an em dash; rewrite with a period, comma, colon, or parentheses"
  "–": "an en dash; use 'to' for ranges or rewrite"
  "!": "an exclamation mark"

